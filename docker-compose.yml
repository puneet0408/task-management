services:
  backend:
    build:
      context: ./backend
    container_name: task-backend
    restart: unless-stopped
    env_file:
      - ./backend/config.env
    networks:
      - task-network
  redis:
    image: redis:latest
    container_name: task-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    networks:
      - task-network

  frontend:
    build:
      context: ./frontend
    container_name: task-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - task-network

networks:
  task-network:
    driver: bridge